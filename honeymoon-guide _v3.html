<style>
  :root{
    --ink:#1c2531;
    --ink-soft:#2c3646;
    --paper:#faf6ee;
    --paper-dim:#f1ead8;
    --paper-line:#e4d9bf;
    --gold:#c2924e;
    --gold-soft:#e8d3a8;
    --hun:#8c3b3b;

    --aut:#3f6b4a;

    --muted:#6b6558;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;

  .mono{font-family:'IBM Plex Mono', monospace;}
  .serif{font-family:'Noto Serif KR', serif;}
  #root{min-height:100vh;}
  ::selection{background:var(--gold-soft);}

  .app{
    max-width:1180px;
    margin:0 auto;
    background:var(--paper);
    min-height:100vh;
    box-shadow:0 0 60px rgba(0,0,0,.35);
  }
  .topbar{
    background:var(--ink);
    color:var(--paper);
    padding:22px 28px 18px;
    position:sticky; top:0; z-index:50;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:var(--gold-soft); opacity:.85;}
  .brand h1{font-family:'Noto Serif KR',serif; font-size:22px; margin:2px 0 0; font-weight:700; letter-spacing:-.01em;}
  .brand .route{font-size:12.5px; color:#c9cfd8; margin-top:4px;}
  .tabs{display:flex; gap:4px; margin-top:16px; flex-wrap:wrap;}
  .tab{
    background:transparent; border:1px solid rgba(255,255,255,.16);
    color:#d7dbe2; padding:8px 13px; border-radius:999px; font-size:13px;
    cursor:pointer; font-family:'Noto Sans KR',sans-serif; font-weight:500;
    transition:background .15s, color .15s, border-color .15s;
  }
  .tab:hover{border-color:rgba(255,255,255,.4);}
  .tab.active{background:var(--gold); border-color:var(--gold); color:#241a0c; font-weight:700;}

  .content{padding:28px;}
  @media (max-width:640px){ .content{padding:18px;} .topbar{padding:18px 16px 14px;} }

  .route-rail{
    display:flex; overflow-x:auto; gap:0; padding:6px 2px 18px;
    border-bottom:1px solid var(--line); margin-bottom:22px;
  }
  .stop{ flex:0 0 auto; text-align:center; padding:0 15px; position:relative; cursor:pointer; min-width:70px; }
  .stop:not(:last-child)::after{
    content:''; position:absolute; top:22px; right:-2px; width:30px; height:2px; background:var(--line);
  }
  .stop .dot{ width:13px; height:13px; border-radius:50%; margin:8px auto 6px; border:2px solid var(--muted); background:var(--paper); }
  .stop.active .dot{ background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 4px var(--gold-soft); }
  .stop .d{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);}
  .stop.active .d{color:var(--ink); font-weight:600;}
  .stop .city{font-size:11px; color:#a89f8a; margin-top:2px; letter-spacing:.01em; line-height:1.3;}
  .stop.active .city{color:var(--ink); font-weight:700;}

  .day-head{display:flex; align-items:center; gap:14px; margin-bottom:6px; flex-wrap:wrap;}
  .day-badge{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; padding:5px 11px; border-radius:6px; color:#fff; }
  .day-head h2{font-family:'Noto Serif KR',serif; font-size:24px; margin:0; font-weight:700;}
  .day-sub{color:var(--muted); font-size:13.5px; margin:2px 0 22px;}

  .card h3{ font-family:'Noto Serif KR',serif; font-size:15px; margin:0 0 12px; font-weight:700; display:flex; align-items:center; gap:8px; }

  table.sched .t{font-family:'IBM Plex Mono',monospace; color:var(--muted); white-space:nowrap; width:56px; font-size:12.5px; padding-top:11px;}
  table.sched .ti{font-weight:600;}
  table.sched .tr-note{color:var(--muted); font-size:12px; margin-top:2px;}

  .warnlist li{font-size:13px; line-height:1.6; padding-left:18px; position:relative;}
  .warnlist li::before{content:'—'; position:absolute; left:0; color:var(--gold);}
  .histgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:700px){ .histgrid{grid-template-columns:1fr;} }
  .lead-p{font-size:13.3px; line-height:1.75; color:#3a352b; margin:0 0 6px;}

  .bk-item{border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; background:#fff;}
  .bk-item .bk-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .bk-item h4{font-family:'Noto Serif KR',serif; font-size:15px; margin:0; font-weight:700;}
  .bk-when{font-family:'IBM Plex Mono',monospace; font-size:10.5px; background:var(--ink); color:var(--gold-soft); padding:3px 9px; border-radius:5px; white-space:nowrap;}
  .bk-item p{font-size:13px; line-height:1.72; color:#3a352b; margin:10px 0 0;}
  .bk-item .how{margin-top:8px; font-size:12.8px; background:var(--paper-dim); padding:11px 13px; border-radius:7px; line-height:1.7;}

  .bk-item .how ol{margin:0; padding-left:18px;}

  .check-cat{margin-bottom:22px;}

  .check-row{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-top:1px solid var(--paper-line);}
  .check-row:first-of-type{border-top:none;}
  .check-row input{margin-top:3px; width:16px; height:16px; accent-color:var(--gold); flex:0 0 auto;}
  .check-row .cname{font-weight:600; font-size:13.5px;}
  .check-row .cdesc{font-size:12.3px; color:var(--muted); margin-top:2px; line-height:1.55;}

  .food-card{border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; background:#fff;}
  .food-card .fname{font-family:'Noto Serif KR',serif; font-weight:700; font-size:14.5px;}
  .food-card p{font-size:12.9px; line-height:1.7; color:#3a352b; margin:5px 0 0;}
  .food-tag{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; background:var(--paper-dim); border-radius:5px; padding:2px 7px; margin-top:8px; color:var(--muted);}

  .shop-card{border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; background:#fff;}
  .shop-card h4{font-family:'Noto Serif KR',serif; font-size:14.5px; margin:0 0 6px;}
  .shop-card p{font-size:12.9px; line-height:1.7; color:#3a352b; margin:0;}
  .gift-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .gift-pill{background:var(--paper-dim); border-radius:999px; padding:6px 12px; font-size:12px;}

  .footer-note{color:var(--muted); font-size:11.8px; text-align:center; padding:30px 20px 40px; line-height:1.8;}
</style>
</head>

/* ============================= COMPONENTS ============================= */

function Sched({items}){
  return (
    <table className="sched"><tbody>
      {items.map((r,i)=>(
        <tr key={i}>
          <td className="t">{r.t}</td>
          <td>
            <div className="ti">{r.ti}</div>
            {r.note && <div className="tr-note">{r.note}</div>}
          </td>
        </tr>
      ))}
    </tbody></table>
  );
}

function DayView({day}){
  return (
    <div>
      <div className="day-head">
        <span className="day-badge" style={{background:day.color}}>{day.dplus}</span>
        <h2>{day.city}</h2>
      </div>
      <div className="day-sub">{day.date} · 여행 {day.id}일차</div>

      <div className="grid2">
        <div>
          <div className="card">
            <h3><span className="bar" style={{background:day.color}}></span>일정표</h3>
            <Sched items={day.schedule} />
          </div>

          <div className="card">
            <h3><span className="bar" style={{background:day.color}}></span>이동 · 예약 상세 안내</h3>
            {day.transport.map((tp,i)=>(
              <div className="note-block" key={i}>
                <span className="tip-label">{tp.label}</span>
                {tp.body}
                {tp.how && <div style={{marginTop:8, fontSize:'12.3px'}}><b>어디서/어떻게:</b> {tp.how}</div>}
                {tp.steps && <ol className="steps">{tp.steps.map((s,j)=><li key={j}>{s}</li>)}</ol>}
              </div>
            ))}
          </div>
        </div>

        <div>
          {day.landmarks.length>0 &&
          <div className="card">
            <h3><span className="bar" style={{background:day.color}}></span>명소 이야기</h3>
            {day.landmarks.map((l,i)=>(
              <div className="landmark" key={i}>
                <div className="name">{l.name}</div>
                <p>{l.desc}</p>
              </div>
            ))}
          </div>}

          {day.food && <div className="food-strip">
            <span className="tip-label">오늘의 음식 추천</span>
            {day.food}
          </div>}

          <div className="culture-strip" style={{marginTop: day.food? '12px':'0'}}>
            <span className="tip-label">현지 문화 팁</span>
            {day.culture}
          </div>
        </div>
      </div>
    </div>
  );
}

function ItineraryTab(){
  const [sel, setSel] = useState(1);
  const day = DAYS.find(d=>d.id===sel);
  return (
    <div>
      <div className="route-rail">
        {DAYS.map(d=>(
          <div key={d.id} className={"stop"+(d.id===sel?' active':'')} onClick={()=>setSel(d.id)}>
            <div className="dot" style={d.id===sel?{background:d.color, borderColor:d.color, boxShadow:'0 0 0 4px '+d.color+'33'}:{}}></div>
            <div className="d">{d.dplus}</div>
            <div className="city">{d.city.replace(' → ','→').split('→')[0]}</div>
          </div>
        ))}
      </div>
      <DayView day={day} />
    </div>
  );
}

     how:['oebb.at 접속 → 출발/도착역·날짜 입력','좌석지정(Sitzplatzreservierung) 옵션 체크','해외카드로 결제','모바일 티켓(QR) 다운로드 후 캡처 저장(오프라인 대비)']},
    {when:'출발 전 (~D-5)', title:'다뉴브강 야경 크루즈 (부다페스트, 9.15 밤 21:30)',

     how:['GetYourGuide/Viator 등에서 날짜·인원·시간 선택 후 예약','모바일 바우처 다운로드','승선 15분 전 선착장(세체니다리 인근) 도착']},
    {when:'현지에서, 체크인 시', title:'guest mobility 카드 (잘츠부르크 숙소에서 발급)',
     body:'Austria Trend Europa Salzburg 체크인 시 요청하면 받을 수 있는 지역 교통카드로, D+7 할슈타트 이동일의 여러 버스 구간을 무료/할인가로 이용할 수 있어요. 체크인할 때 꼭 발급을 요청하세요.'},
    {when:'출발 전 (~D-7)', title:'프라하성 시간대 지정 입장권',
     body:'성수기 매표소 줄이 길기로 유명해요. 프라하성 공식 홈페이지에서 입장 시간대를 지정해 예매하면 대기 없이 들어갈 수 있습니다.',
     how:['hrad.cz(프라하성 공식 홈페이지) 접속','티켓 메뉴 → 방문 날짜·시간 선택','코스(Okruh A/B/C) 선택 후 예매']},
    {when:'출발 전, 선택', title:'인기 레스토랑 예약 (피그뮐러, 립스 오브 비엔나 등)',
     body:'비엔나의 유명 슈니첼집 피그뮐러는 웨이팅이 긴 편이라 방문 며칠 전 홈페이지나 전화로 예약해두면 대기 없이 이용할 수 있어요.',
     how:['각 레스토랑 공식 홈페이지 예약(Reservation) 메뉴 확인','또는 현지 도착 후 호텔 프런트에 전화 예약 요청']},
    {when:'현지에서, 당일', title:'잘츠카머구트 지역버스 (150 / S41 / S42 / S43)',

     how:['앱스토어에서 "Postbus" 또는 "VOR/SVV" 설치','노선번호·시간 확인','정류장에서 승차 후 기사에게 결제']},
    {when:'현지에서, 당일', title:'부다페스트 공항버스(100E) · 시내 대중교통',
     body:'"BudapestGO" 앱 하나로 100E 버스부터 지하철·트램까지 모두 구매·검표할 수 있어요.',
     how:['"BudapestGO" 앱 설치 → 회원가입','노선/구간권 구매','QR 티켓으로 탑승 시 태그']},
    {when:'현지에서, 당일', title:'빈 대중교통권 (Wiener Linien)',
     body:'지하철역 자동발매기나 "WienMobil" 앱에서 24/48/72시간권을 구매하면 개별 승차권보다 경제적이에요.',
     how:['지하철역 자동발매기 또는 "WienMobil" 앱','기간권 선택 후 구매']},
    {when:'현지에서, 당일', title:'할슈타트 호수 페리',
     body:'할슈타트 마을 선착장에서 기차 시간에 맞춰 운행하는 소형 배로, 예약 없이 현장에서 현금으로 결제하면 됩니다.'},
    {when:'출발 전', title:'유심 / 이심, 로밍',
     body:'유럽 전역(헝가리·오스트리아·체코 모두 커버)에서 쓸 수 있는 유럽 통합 유심 또는 이심을 출발 전 준비하면 국경을 넘을 때마다 통신사를 바꿀 필요가 없어요.'},
  ];
  return (
    <div>
      <div className="section-title"><span className="bar" style={{background:'var(--gold)'}}></span>예약 가이드 — 언제, 무엇을, 어디서</div>
      {BOOKING_GUIDE.map((b,i)=>(
        <div className="bk-item" key={i}>
          <div className="bk-top">
            <h4>{b.title}</h4>
            <span className="bk-when">{b.when}</span>
          </div>
          <p>{b.body}</p>
          {b.how && <div className="how"><b>어디서 / 어떻게</b><ol>{b.how.map((s,j)=><li key={j}>{s}</li>)}</ol></div>}
        </div>
      ))}
    </div>
  );
}

function FoodTab(){
  const [sel, setSel] = useState('hungary');
  const c = COUNTRIES[sel];
  const f = FOOD[sel];
  return (
    <div>
      <div className="country-tabs">
        {Object.values(COUNTRIES).map(cc=>(
          <div key={cc.key} className={"ctab"+(sel===cc.key?' active':'')}
               style={sel===cc.key?{background:cc.color, borderColor:cc.color, color:'#fff'}:{color:cc.color}}
               onClick={()=>setSel(cc.key)}>{cc.name} 음식</div>
        ))}
      </div>
      <p className="lead-p">{f.intro}</p>
      {f.musts.map((m,i)=>(
        <div className="food-card" key={i}>
          <div className="fname">{m.name}</div>
          <p>{m.desc}</p>
          <span className="food-tag">{m.tag}</span>
        </div>
      ))}
    </div>
  );
}

function ShoppingTab(){
  const [sel, setSel] = useState('hungary');
  const c = COUNTRIES[sel];
  const s = SHOPPING[sel];
  return (
    <div>
      <div className="country-tabs">
        {Object.values(COUNTRIES).map(cc=>(
          <div key={cc.key} className={"ctab"+(sel===cc.key?' active':'')}
               style={sel===cc.key?{background:cc.color, borderColor:cc.color, color:'#fff'}:{color:cc.color}}
               onClick={()=>setSel(cc.key)}>{cc.name} 쇼핑</div>
        ))}
      </div>

      <div className="section-title"><span className="bar" style={{background:c.color}}></span>쇼핑 스팟</div>
      {s.areas.map((a,i)=>(
        <div className="shop-card" key={i}><h4>{a.name}</h4><p>{a.desc}</p></div>
      ))}

      <div className="section-title"><span className="bar" style={{background:c.color}}></span>가족 선물 추천</div>
      <div className="gift-grid">{s.giftIdeas.map((g,i)=><span className="gift-pill" key={i}>{g}</span>)}</div>

      <div className="section-title"><span className="bar" style={{background:c.color}}></span>텍스프리(부가세 환급) 안내</div>
      <p className="lead-p">{s.taxfree}</p>
    </div>
  );
}

function TipsTab(){
  return (
    <div>
      <div className="section-title"><span className="bar" style={{background:'var(--gold)'}}></span>여행가이드가 알려주는 꿀팁</div>
      <div className="grid2">
        {TIPS.map((t,i)=>(
          <div className="card" key={i}>
            <h3><span style={{fontSize:'17px'}}>{t.icon}</span>{t.title}</h3>
            <p style={{fontSize:'12.9px', lineHeight:1.72, color:'#3a352b', margin:0}}>{t.body}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

function ChecklistTab(){
  return (
    <div>
      <div className="section-title"><span className="bar" style={{background:'var(--gold)'}}></span>출발 전 최종 체크리스트</div>
      {CHECKLIST.map((cat,i)=>(
        <div className="check-cat" key={i}>
          <h3>{cat.cat}</h3>
          {cat.items.map((it,j)=>(
            <label className="check-row" key={j}>
              <input type="checkbox" />
              <div>
                <div className="cname">{it.n}</div>
                {it.d && <div className="cdesc">{it.d}</div>}
              </div>
            </label>
          ))}
        </div>
      ))}
    </div>
  );
}

function App(){
  const [tab, setTab] = useState('itinerary');
  const TABS = [
    {k:'itinerary', label:'일정 (D+1~D+11)'},
    {k:'booking', label:'교통 · 예약 가이드'},
    {k:'country', label:'나라별 문화 가이드'},
    {k:'food', label:'음식 가이드'},
    {k:'shopping', label:'쇼핑 & 기념품'},
    {k:'tips', label:'여행 꿀팁'},
    {k:'checklist', label:'체크리스트'},
  ];
  return (
    <div className="app">
      <div className="topbar">
        <div className="brand">
          <span className="eyebrow mono">JEON · HOON HONEYMOON JOURNAL</span>
          <h1 className="serif">젼 훈의 신혼여행 가이드</h1>
          <div className="route">9.14 – 9.24 · 부다페스트 → 비엔나 → 잘츠부르크 → 할슈타트 → 프라하</div>
        </div>
        <div className="tabs">
          {TABS.map(t=>(
            <button key={t.k} className={"tab"+(tab===t.k?' active':'')} onClick={()=>setTab(t.k)}>{t.label}</button>
          ))}
        </div>
      </div>

      <div className="content">
        {tab==='itinerary' && <ItineraryTab/>}
        {tab==='booking' && <BookingTab/>}
        {tab==='country' && <CountryTab/>}
        {tab==='food' && <FoodTab/>}
        {tab==='shopping' && <ShoppingTab/>}
        {tab==='tips' && <TipsTab/>}
        {tab==='checklist' && <ChecklistTab/>}
      </div>

      <div className="footer-note">
        본 가이드는 첨부된 일정표를 바탕으로 작성되었습니다. 열차·버스 시간표와 요금은 현지 사정에 따라 바뀔 수 있으니<br/>
        출발 전 OBB(oebb.at), BudapestGO, Wiener Linien, hrad.cz 등 공식 채널에서 최종 확인하세요. 행복한 신혼여행 되세요 💛
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
