<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />

<title>강원지역단 9월 2주차 (7~11일) 시상 가이드 | 열정이</title>

<meta property="og:title" content="강원지역단 9월 2주차 (7~11일) 시상 가이드" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --navy:#0F2A52;
    --sky:#1E5FB8;
    --ice:#EAF2FC;
    --tiger:#F5A623;
    --tiger-deep:#E08A00;
    --snow:#FFFFFF;
    --mist:#F4F7FB;
    --ink:#152238;
    --sub:#5B6B84;
    --line:#DCE6F2;
    --good:#1E9E6B;
    --warn:#C0392B;
    --gold:#C9A227;
    --radius:20px;
    --radius-sm:12px;
    --shadow:0 8px 24px rgba(15,42,82,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,sans-serif;
    background:
      radial-gradient(140% 90% at 50% -10%, #163a6e 0%, #0F2A52 55%, #0A1E3D 100%);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:480px;margin:0 auto;min-height:100vh;background:var(--mist);position:relative;box-shadow:0 0 60px rgba(0,0,0,0.35);}
  button{font-family:inherit;}
  .app{padding-bottom:48px;}

  /* ===== Header ===== */
  .hero{
    position:relative;
    background:
      linear-gradient(180deg, rgba(255,255,255,0) 60%, var(--mist) 100%),
      radial-gradient(120% 100% at 15% 0%, #2E6FCC 0%, #163A6E 55%, #0B2148 100%);
    padding:22px 20px 30px;
    overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
    border-radius:50%;background:radial-gradient(circle, rgba(245,166,35,0.35), transparent 70%);
  }
  .hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;}
  .badge-region{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);
    color:#fff;font-size:13.5px;font-weight:700;letter-spacing:0.3px;
    padding:6px 12px;border-radius:999px;
  }
  .badge-week{
    background:var(--tiger);color:#1A1200;font-weight:800;font-size:13.5px;
    padding:6px 12px;border-radius:999px;letter-spacing:0.2px;
  }
  .hero-body{display:flex;align-items:center;gap:14px;margin-top:18px;position:relative;z-index:2;}
  .mascot-wrap{
    width:104px;height:104px;border-radius:28px;overflow:hidden;flex-shrink:0;
    background:linear-gradient(160deg,#2E6FCC,#0F2A52);
    box-shadow:0 10px 26px rgba(0,0,0,0.35), inset 0 0 0 3px rgba(255,255,255,0.18);
    animation:mascotFloat 3.6s ease-in-out infinite;
  }
  .mascot-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  @keyframes mascotFloat{
    0%,100%{transform:translateY(0) rotate(-1deg);}
    50%{transform:translateY(-6px) rotate(1deg);}
  }
  .mascot-wrap.cheer{animation:mascotCheer 0.7s ease-in-out;}
  @keyframes mascotCheer{
    0%{transform:scale(1) rotate(0);}
    30%{transform:scale(1.12) rotate(-6deg);}
    60%{transform:scale(1.08) rotate(6deg);}
    100%{transform:scale(1) rotate(0);}
  }
  .hero-text h1{margin:0 0 4px;color:#fff;font-size:20px;font-weight:800;line-height:1.35;letter-spacing:-0.2px;}
  .hero-text p{margin:0;color:#B9CBE8;font-size:14px;line-height:1.5;}
  .hero-quote{
    margin-top:16px;position:relative;z-index:2;
    background:rgba(255,255,255,0.08);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.18);border-radius:14px;
    padding:12px 14px;color:#EAF1FF;font-size:14px;font-weight:600;line-height:1.5;
  }

  /* ===== Section shells ===== */
  .section{padding:22px 20px 6px;}
  .section-title{
    display:flex;align-items:baseline;gap:6px;margin:0 0 12px;
    font-size:17px;font-weight:800;color:var(--navy);letter-spacing:-0.2px;
  }
  .section-title .num{color:var(--sky);font-size:14px;font-weight:800;}
  .section-title-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;
  }
  .poster-btn{
    flex-shrink:0;display:flex;align-items:center;gap:5px;
    background:#fff;border:1.5px solid var(--line);color:var(--navy);
    font-size:13px;font-weight:800;padding:7px 11px;border-radius:999px;cursor:pointer;
    box-shadow:0 2px 6px rgba(15,42,82,0.06);
  }
  .poster-btn:active{transform:scale(0.96);}
  .poster-overlay{
    position:fixed;inset:0;background:rgba(10,20,40,0.65);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .poster-sheet{
    width:100%;max-width:480px;max-height:88vh;background:var(--mist);
    border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;
    animation:sheetUp .22s ease-out;
  }
  @keyframes sheetUp{ from{transform:translateY(24px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  .poster-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;background:#fff;border-bottom:1px solid var(--line);
    font-size:16px;font-weight:800;color:var(--navy);flex-shrink:0;
  }
  .poster-close{
    border:none;background:var(--mist);width:30px;height:30px;border-radius:50%;
    font-size:15px;color:var(--sub);cursor:pointer;
  }
  .poster-scroll{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;}
  .poster-img{width:100%;border-radius:12px;display:block;box-shadow:0 4px 14px rgba(0,0,0,0.12);}
  .poster-zoom-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden;}
  .poster-zoom-img{max-width:100%;max-height:80vh;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,0.5);transition:transform 0.08s ease-out;will-change:transform;touch-action:none;user-select:none;}
  .poster-zoom-close{position:fixed;top:16px;right:16px;z-index:401;}
  .poster-zoom-hint{color:rgba(255,255,255,0.65);font-size:12.5px;margin-bottom:12px;text-align:center;}
  .card{
    background:var(--snow);border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid rgba(15,42,82,0.05);padding:18px;
  }

  /* ===== Form ===== */
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:8px;
  }
  .field .hint{font-weight:500;color:var(--sub);font-size:13px;margin-top:6px;line-height:1.5;}
  .input-money{position:relative;}
  .input-money input{
    width:100%;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 44px 14px 16px;font-size:19px;font-weight:700;color:var(--ink);
    background:var(--mist);transition:border-color .15s, background .15s;
    -moz-appearance:textfield;
  }
  .input-money input::-webkit-outer-spin-button,
  .input-money input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .input-money input:focus{outline:none;border-color:var(--sky);background:#fff;}
  .input-money span{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    font-size:15px;font-weight:700;color:var(--sub);
  }
  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 4px;border-bottom:1px solid var(--line);
  }
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .t-label{font-size:15px;font-weight:700;color:var(--ink);}
  .toggle-row .t-sub{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px;}
  .switch{
    position:relative;width:50px;height:29px;border-radius:999px;border:none;
    background:#D9E1EC;cursor:pointer;flex-shrink:0;transition:background .18s;padding:0;
  }
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
    background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.22);transition:left .18s;
  }
  .switch.on{background:var(--tiger);}
  .switch.on::after{left:24px;}
  .group-title{font-size:13px;font-weight:800;color:var(--sky);text-transform:uppercase;letter-spacing:0.5px;margin:22px 0 10px;}
  .auto-linked-note{background:rgba(245,166,35,0.12);border:1px solid rgba(245,166,35,0.35);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.5;color:#F5A623;margin-top:8px;}
  .group-title:first-child{margin-top:0;}
  .lookup-error{
    background:#FDEDEC;color:var(--warn);font-size:14px;font-weight:700;
    border-radius:12px;padding:11px 14px;margin-top:6px;line-height:1.5;
  }

  .submit-btn{
    width:100%;margin-top:24px;padding:17px;border:none;border-radius:16px;
    background:linear-gradient(135deg,var(--tiger),var(--tiger-deep));
    color:#1A1200;font-size:17.5px;font-weight:800;letter-spacing:-0.2px;
    box-shadow:0 10px 22px rgba(224,138,0,0.35);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .submit-btn:active{transform:scale(0.98);}

  /* ===== Result ===== */
  .total-card{
    background:linear-gradient(150deg,#173B72 0%, #0F2A52 60%, #0A1E3D 100%);
    border-radius:24px;padding:26px 22px;color:#fff;position:relative;overflow:hidden;
    box-shadow:0 14px 30px rgba(10,20,40,0.35);
  }
  .total-card::after{
    content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle, rgba(245,166,35,0.28), transparent 70%);
  }
  .total-card .tc-label{font-size:14px;font-weight:700;color:#AEC3E4;position:relative;z-index:1;}
  .total-card .tc-amount{
    font-size:36px;font-weight:900;letter-spacing:-0.5px;margin:8px 0 2px;position:relative;z-index:1;
  }
  .total-card .tc-amount span{font-size:18px;font-weight:700;margin-left:2px;color:#DCE8FA;}
  .total-card .tc-note{font-size:13px;color:#8FA6C9;position:relative;z-index:1;line-height:1.6;margin-top:8px;}

  .detail-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .detail-item{
    display:flex;align-items:flex-start;gap:12px;background:var(--snow);
    border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);border:1px solid rgba(15,42,82,0.05);
  }
  .detail-item.dim{opacity:0.55;}
  .check-ic{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;
    background:rgba(30,158,107,0.12);display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .check-ic svg{width:15px;height:15px;}
  .check-ic.muted{background:#EDEFF3;}
  .check-ic.muted svg path{stroke:#9AA5B4;}
  .detail-body{flex:1;min-width:0;}
  .detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .detail-name{font-size:15.5px;font-weight:800;color:var(--navy);}
  .detail-amount{font-size:16.5px;font-weight:800;color:var(--good);white-space:nowrap;}
  .detail-amount.zero{color:#9AA5B4;}
  .detail-tag{
    display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;color:var(--tiger-deep);
    background:#FFF3E0;padding:2px 8px;border-radius:999px;
  }
  .detail-desc{font-size:13px;color:var(--sub);margin-top:5px;line-height:1.5;}
  .vip-note-card{background:linear-gradient(120deg,rgba(245,166,35,0.14),rgba(245,166,35,0.05));border:1px solid rgba(245,166,35,0.35);border-radius:16px;padding:16px 18px;}
  .vip-note-title{font-size:14px;font-weight:800;color:#0A2E5C;margin-bottom:6px;}
  .vip-note-body{font-size:13.5px;color:#0A2E5C;line-height:1.6;}
  .vip-highlight{color:#E8720C;}

  .goods-grid{display:flex;flex-direction:column;gap:4px;margin-top:14px;}
  .goods-item{
    background:var(--snow);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);
    border:1px solid rgba(15,42,82,0.05);display:flex;gap:12px;align-items:center;
  }
  .goods-plus{
    display:flex;align-items:center;justify-content:center;height:22px;position:relative;z-index:1;
  }
  .goods-plus span{
    width:26px;height:26px;border-radius:50%;background:var(--tiger);color:#1A1200;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;
    box-shadow:0 3px 8px rgba(224,138,0,0.35);
  }
  .goods-icon{
    width:44px;height:44px;border-radius:12px;background:linear-gradient(150deg,#FFE7BE,#FFD088);
    display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;
  }
  .goods-type{
    display:inline-block;font-size:11px;font-weight:800;color:var(--tiger-deep);
    background:#FFF3E0;padding:2px 7px;border-radius:999px;margin-bottom:4px;
  }
  .goods-name{font-size:15px;font-weight:800;color:var(--navy);line-height:1.4;}
  .goods-sub{font-size:12.5px;color:var(--sub);margin-top:3px;}

  .next-card{
    margin-top:14px;background:var(--ice);border:1.5px dashed #9FC1EC;border-radius:16px;
    padding:15px 16px;
  }
  .next-card .nc-title{font-size:14px;font-weight:800;color:var(--sky);display:flex;align-items:center;gap:6px;}
  .next-card .nc-body{font-size:14px;color:var(--navy);font-weight:600;margin-top:6px;line-height:1.55;}
  .next-card .nc-body b{color:var(--tiger-deep);font-weight:800;}
  .next-card .nc-note{font-size:12px;color:var(--sub);margin-top:6px;font-weight:500;}
  .promo-banner{
    margin-top:12px;background:linear-gradient(120deg,#173B72,#0F2A52);color:#fff;
    border-radius:16px;padding:14px 16px;font-size:13.5px;font-weight:700;line-height:1.6;
    display:flex;gap:10px;align-items:flex-start;
  }
  .promo-banner .dot{width:6px;height:6px;border-radius:50%;background:var(--tiger);margin-top:6px;flex-shrink:0;}

  .share-row{display:flex;gap:10px;margin-top:22px;}
  .share-btn{
    flex:1;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:800;
    display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  }
  .share-btn.primary{background:var(--navy);color:#fff;}
  .share-btn.secondary{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .share-btn:active{transform:scale(0.97);}

  .redo-btn{
    width:100%;margin-top:12px;padding:14px;border-radius:14px;border:1.5px solid var(--line);
    background:transparent;color:var(--sub);font-size:14.5px;font-weight:700;cursor:pointer;
  }

  .legal{margin:26px 20px 0;font-size:12px;color:#9AA5B4;line-height:1.7;text-align:center;padding:0 6px;}
  .legal .lock{display:inline-block;margin-right:4px;}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:rgba(15,34,56,0.92);color:#fff;padding:11px 18px;border-radius:999px;
    font-size:14px;font-weight:600;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,0.3);
    white-space:nowrap;
  }

  .capture-card{padding:26px 22px;background:linear-gradient(160deg,#173B72,#0A1E3D);}
  .capture-scope{padding-bottom:8px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

/* =========================================================
   1) CONFIG — 규칙이 바뀌면 이 블록만 수정하면 됩니다.
   ========================================================= */
const CONFIG = {
  region: "강원지역단",
  mascotName: "열정이",

const won = (n) => (n < 0 ? 0 : n).toLocaleString("ko-KR");

function findBand(bands, amount) {
  return bands.find(b => amount >= b.min && amount < b.max) || null;
}

function calcAwardA(performance, highcap20, monthlyPass) {
  const cfg = CONFIG.awardA;
  if (monthlyPass || performance >= cfg.fullRateFrom) {
    return {
      amount: performance,
      confirmed: true,
      note: performance >= cfg.fullRateFrom ? "실적의 100% 인정" : "예외조건 충족 · 실적 100% 인정",
      nextGoal: null,
    };
  }
  const band = findBand(cfg.bands, performance);
  if (!band) {
    return { amount: 0, confirmed: false, note: "10만원 미만 · 미지급", nextGoal: cfg.bands[1] };
  }
  const amount = highcap20 ? band.highcap : band.normal;
  const idx = cfg.bands.indexOf(band);
  const next = cfg.bands[idx + 1];
  let nextGoal = null;
  if (next) {
    const nextAmt = highcap20 ? next.highcap : next.normal;
    nextGoal = { remain: next.min - performance, gain: nextAmt - amount, atAmount: next.min };
    if (!highcap20) {
      nextGoal.highcapGain = next.highcap - amount;
    }
  } else {
    nextGoal = { remain: cfg.fullRateFrom - performance, gain: null, atAmount: cfg.fullRateFrom, isFullRate: true };
  }
  return { amount, confirmed: amount > 0, note: highcap20 ? "하이캡 20배↑ 구간 적용" : null, nextGoal };
}

function calcAwardB(performance) {
  const bands = CONFIG.awardB.bands;
  const band = findBand(bands, performance);
  if (!band) {
    const first = bands[0];
    return { achieved: false, band: null, nextGoal: { remain: first.min - performance, band: first } };
  }
  const idx = bands.indexOf(band);
  const next = bands[idx + 1];
  const nextGoal = next ? { remain: next.min - performance, band: next } : null;
  return { achieved: true, band, nextGoal };
}

function calcAwardC_highcapActive(qualifyingContracts) {
  const cfg = CONFIG.awardC_highcapActive;
  const count = Math.max(0, Math.floor(qualifyingContracts || 0));
  if (count < 1) return { achieved: false, count: 0 };
  return { achieved: true, count, itemName: `${cfg.itemName} X${count}개` };
}

function calcAwardD_highcapBridge(highcapBridgeAmount, performance) {
  const cfg = CONFIG.awardD_highcapBridge;
  if (performance < cfg.minPerformanceForConfirm) {
    return { amount: 0, confirmed: false, reason: "week", nextGoal: { remain: cfg.minPerformanceForConfirm - performance } };
  }
  if (highcapBridgeAmount < cfg.minPerformanceForConfirm) {
    return { amount: 0, confirmed: false, reason: "bridge", nextGoal: { remain: cfg.minPerformanceForConfirm - highcapBridgeAmount } };
  }
  const band = findBand(cfg.bands, highcapBridgeAmount);
  if (!band) return { amount: 0, confirmed: false, reason: "bridge", nextGoal: { remain: cfg.bands[0].min - highcapBridgeAmount } };
  return { amount: band.amount, confirmed: true, rate: band.rate };
}

function calcAwardVIP(performance, highcap20) {
  // 원래 조건은 "평균 하이캡 22배수 이상"이지만, 별도 22배수 입력 없이
  // "하이캡 실적 20배수 이상" 토글로 근사 판정합니다.
  const cfg = CONFIG.awardVIP;
  const achieved = performance >= cfg.minAmount && highcap20;
  return { achieved, reward: cfg.reward, period: cfg.period, nextGoal: achieved ? null : { remain: Math.max(0, cfg.minAmount - performance) } };
}

function calcAll(input) {
  const performance = input.performance;
  const a = calcAwardA(performance, input.highcap20, input.monthlyPass);
  const b = calcAwardB(performance);
  const c = calcAwardC_highcapActive(input.qualifyingContracts);
  const d = calcAwardD_highcapBridge(input.highcapBridgeAmount, performance);
  const vip = calcAwardVIP(performance, input.highcap20);

  const totalConfirmedCash = (a.confirmed ? a.amount : 0) + (d.confirmed ? d.amount : 0);

  return { a, b, c, d, vip, totalConfirmedCash, performance };
}

function ZoomableImage({ src, alt }) {
  const [scale, setScale] = useState(1);
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const stateRef = useRef({ scale: 1, pos: { x: 0, y: 0 } });
  const pinchDist = useRef(null);
  const dragStart = useRef(null);
  const lastTapRef = useRef(0);

  useEffect(() => { stateRef.current = { scale, pos }; }, [scale, pos]);

  const MIN_SCALE = 1;
  const MAX_SCALE = 4;

  const clampScale = (s) => Math.min(Math.max(s, MIN_SCALE), MAX_SCALE);

  const getDistance = (touches) => {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  };

  const reset = () => {
    setScale(1);
    setPos({ x: 0, y: 0 });
  };

  const handleTouchStart = (e) => {
    if (e.touches.length === 2) {
      pinchDist.current = getDistance(e.touches);
    } else if (e.touches.length === 1) {
      const now = Date.now();
      if (now - lastTapRef.current < 300) {
        reset();
      }
      lastTapRef.current = now;
      dragStart.current = {
        x: e.touches[0].clientX,
        y: e.touches[0].clientY,
        origin: stateRef.current.pos,
      };
    }
  };

  const handleTouchMove = (e) => {
    if (e.touches.length === 2 && pinchDist.current) {
      e.preventDefault();
      const dist = getDistance(e.touches);
      const ratio = dist / pinchDist.current;
      const next = clampScale(stateRef.current.scale * ratio);
      setScale(next);
      pinchDist.current = dist;
    } else if (e.touches.length === 1 && dragStart.current && stateRef.current.scale > 1) {
      e.preventDefault();
      const dx = e.touches[0].clientX - dragStart.current.x;
      const dy = e.touches[0].clientY - dragStart.current.y;
      setPos({ x: dragStart.current.origin.x + dx, y: dragStart.current.origin.y + dy });
    }
  };

  const handleTouchEnd = (e) => {
    if (e.touches.length < 2) pinchDist.current = null;
    if (e.touches.length === 0) dragStart.current = null;
  };

  // 데스크톱: 휠로 확대/축소, 드래그로 이동
  const mouseDragging = useRef(false);
  const handleWheel = (e) => {
    e.preventDefault();
    const next = clampScale(stateRef.current.scale + (e.deltaY < 0 ? 0.2 : -0.2));
    setScale(next);
  };
  const handleMouseDown = (e) => {
    if (stateRef.current.scale <= 1) return;
    mouseDragging.current = true;
    dragStart.current = { x: e.clientX, y: e.clientY, origin: stateRef.current.pos };
  };
  const handleMouseMove = (e) => {
    if (!mouseDragging.current || !dragStart.current) return;
    const dx = e.clientX - dragStart.current.x;
    const dy = e.clientY - dragStart.current.y;
    setPos({ x: dragStart.current.origin.x + dx, y: dragStart.current.origin.y + dy });
  };
  const handleMouseUp = () => { mouseDragging.current = false; };

  return (
    <img
      src={src}
      alt={alt}
      className="poster-zoom-img"
      draggable={false}
      onClick={(e) => e.stopPropagation()}
      onDoubleClick={(e) => { e.stopPropagation(); reset(); }}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
      onWheel={handleWheel}
      onMouseDown={handleMouseDown}
      onMouseMove={handleMouseMove}
      onMouseUp={handleMouseUp}
      onMouseLeave={handleMouseUp}
      style={{
        transform: `translate(${pos.x}px, ${pos.y}px) scale(${scale})`,
        cursor: scale > 1 ? "grab" : "zoom-in",
        touchAction: "none",
      }}
    />
  );
}

    const trimmedName = name.trim();
    if (!trimmedName) {
      setError("이름을 입력해주세요.");
      return;
    }

    if (CONFIG.roster.length === 0) {
      onVerified({ name: trimmedName, code: "", highcapBridge: 0 });
      return;

    const nameMatches = CONFIG.roster.filter((r) => r.name === trimmedName);

    if (nameMatches.length === 0) {
      setError("명단에서 확인되지 않는 이름이에요. 이름을 다시 확인해주세요.");
      return;

          </div>
        </div>
      </div>

      <div className="section">
        <div className="card">

            <label>이름</label>
            <div className="input-money">
              <input
                type="text"
                placeholder="이름을 입력해주세요"
                value={name}
                onChange={(e) => { setName(e.target.value); setNeedsCode(false); setError(""); }}
              />
            </div>
          </div>

          {needsCode && (
            <div className="field">

              <div className="input-money">
                <input
                  type="text"
                  inputMode="numeric"

// 현재 구간과 다음 구간의 시상물품 구성을 비교해서

function diffBandItems(currentItems, nextItems) {
  const added = nextItems.slice(currentItems.length);
  const changed = [];
  const minLen = Math.min(currentItems.length, nextItems.length);
  for (let i = 0; i < minLen; i++) {
    if (currentItems[i] !== nextItems[i]) {
      changed.push({ from: currentItems[i], to: nextItems[i] });
    }
  }
  return { added, changed };
}

      <div className="section">
        <div className="section-title-row">
          <div className="section-title" style={{ marginBottom: 0 }}><span className="num">01</span>시상별 상세 내역</div>
          <button className="poster-btn" onClick={() => setPosterOpen(true)}>
            🖼️ 시상 공고문 보기
          </button>
        </div>
        <div className="detail-list">
          <DetailItem
            name={CONFIG.awardA.name}
            amount={r.a.confirmed ? r.a.amount : 0}
            confirmed={r.a.confirmed}
            desc={r.a.note || CONFIG.awardA.exceptionNote}
          />
          <DetailItem
            name={CONFIG.awardD_highcapBridge.name}
            amount={r.d.amount}
            confirmed={r.d.confirmed}
            tag={r.d.confirmed ? r.d.rate : null}
            desc={
              r.d.confirmed
                ? `※ ${CONFIG.awardD_highcapBridge.longTermNote}`
                : r.d.reason === "week"
                  ? `이번 주 인보험 실적 10만원 이상부터 지급 확정돼요 · ※ ${CONFIG.awardD_highcapBridge.longTermNote}`
                  : `8월 3~5주차 고하이캡 브릿지 실적 10만원 이상부터 지급 확정돼요 · ※ ${CONFIG.awardD_highcapBridge.longTermNote}`
            }
          />
        </div>
      </div>

      {goodsList.length > 0 && (
        <div className="section">
          <div className="section-title"><span className="num">02</span>획득한 시상물품</div>
          <div className="goods-grid">
            {goodsList.map((g, i) => (
              <React.Fragment key={i}>
                <div className="goods-item">
                  <div className="goods-icon">{g.icon}</div>
                  <div style={{ minWidth: 0 }}>
                    {g.type && <span className="goods-type">{g.type}</span>}
                    <div className="goods-name">{g.name}</div>
                    <div className="goods-sub">{g.sub}</div>
                  </div>
                </div>
                {i < goodsList.length - 1 && (
                  <div className="goods-plus"><span>+</span></div>
                )}
              </React.Fragment>
            ))}
          </div>
          {r.b.achieved && (
            <div className="detail-desc" style={{ marginTop: 10 }}>
              * {CONFIG.awardB.footerNote}
            </div>
          )}
        </div>
      )}

      <div className="section">
        <div className="section-title"><span className="num">03</span>다음 목표</div>
        {r.a.nextGoal && (
          <div className="next-card">
            <div className="nc-title">🎯 기본시상 다음 구간</div>
            <div className="nc-body">
              <b>{won(r.a.nextGoal.remain)}원</b>만 더 채우면 다음 구간이 되어 시상금이{" "}
              <b>{won(r.a.nextGoal.gain)}원</b> 더 늘어나요.
              {r.a.nextGoal.highcapGain != null && (
                <> 다음 구간 진입과 함께 <b>하이캡 20배수 이상</b>까지 달성하면, 시상금이 <b>{won(r.a.nextGoal.highcapGain)}원</b> 늘어나요.</>
              )}
            </div>
          </div>
        )}
        {!r.d.confirmed && (
          <div className="next-card">
            <div className="nc-title">🎯 고하이캡 브릿지 시상</div>
            <div className="nc-body">
              <b>{won(r.d.nextGoal.remain)}원</b>만 더 채우면 브릿지 시상이 확정돼요.
            </div>
          </div>
        )}
        {!r.b.achieved && r.b.nextGoal && (
          <div className="next-card">
            <div className="nc-title">🎯 추석맞이 누적활성화 시상</div>
            <div className="nc-body">
              <b>{won(r.b.nextGoal.remain)}원</b>만 더 채우면 {r.b.nextGoal.band.items.join(" + ")}를 받을 수 있어요.
            </div>
          </div>
        )}
        {r.b.achieved && r.b.nextGoal && (() => {
          const diff = diffBandItems(r.b.band.items, r.b.nextGoal.band.items);
          return (
            <div className="next-card">
              <div className="nc-title">🎯 추석맞이 누적활성화 시상 업그레이드</div>
              <div className="nc-body">
                <b>{won(r.b.nextGoal.remain)}원</b>만 더 채우면 다음 구간으로 올라가요.
                {diff.changed.map((c, i) => (
                  <span key={i}> {c.from}에서 <b>{c.to}</b>(으)로 늘어나요.</span>
                ))}
                {diff.added.length > 0 && (
                  <span> {diff.added.join(" + ")}가 추가돼요.</span>
                )}
              </div>
            </div>
          );
        })()}
        <div className="detail-desc" style={{ marginTop: 6 }}>
          ※ 위 안내는 현재 입력값 기준 예상 시상이며, 실제 지급은 최종 확정 실적과 개인 한도에 따라 달라질 수 있습니다.
        </div>
      </div>

      <div className="section">
        <div className="vip-note-card" style={{ marginBottom: 10 }}>
          <div className="vip-note-title">[{CONFIG.awardHonors.name}]</div>
          <div className="vip-note-body">
            <b>{CONFIG.awardHonors.period} <span className="vip-highlight">인보험 50만원 이상 시</span> {CONFIG.awardHonors.reward} 시상 지급</b>
          </div>
        </div>
        <div className="vip-note-card">
          <div className="vip-note-title">[{CONFIG.awardVIP.name}]</div>
          <div className="vip-note-body">
            <b>{CONFIG.awardVIP.period} <span className="vip-highlight">100만원 이상 & 하이캡 22배수 이상 시</span> {CONFIG.awardVIP.reward} 시상 지급</b>
          </div>
        </div>
      </div>
      </div>

      <div className="section">
        <div className="share-row">
          <button className="share-btn primary" onClick={handleSaveImage}>📷 결과 이미지 저장</button>
          <button className="share-btn secondary" onClick={handleShare}>🔗 공유하기</button>
        </div>
        <button className="redo-btn" onClick={onReset}>다시 입력하기</button>
      </div>

      <div className="legal">
        본 결과는 입력하신 정보를 바탕으로 한 예상 금액이며, 최종 시상은 지역단 확정 기준에 따라 달라질 수 있습니다.
        {CONFIG.feedbackUrl && (
          <>
            <br />
            <a href={CONFIG.feedbackUrl} target="_blank" style={{ color: "#5B6B84" }}>의견 남기기</a>
          </>
        )}
      </div>

      {toast && <div className="toast">{toast}</div>}
      <PosterModal open={posterOpen} onClose={() => setPosterOpen(false)} />
    </div>
  );
}

function App() {
  const [step, setStep] = useState("lookup");
  const [verifiedUser, setVerifiedUser] = useState(null);
  const [input, setInput] = useState({
    performance: 0,
    qualifyingContracts: 0,
    highcap20: false,
    monthlyPass: false,
    highcapBridgeAmount: 0,
  });

  if (step === "lookup") {
    return (
      <LookupScreen
        onVerified={(user) => {
          setVerifiedUser(user);
          setInput((prev) => ({
            ...prev,
            highcapBridgeAmount: user.highcapBridge || 0,
          }));
          setStep("form");
        }}
      />
    );
  }
  if (step === "result") {
    return <ResultView input={input} verifiedUser={verifiedUser} onReset={() => setStep("form")} />;
  }
  return <IntroForm input={input} setInput={setInput} onSubmit={() => setStep("result")} verifiedUser={verifiedUser} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
