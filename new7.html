<style>
  :root{
    --navy:#0F2A52;
    --sky:#1E5FB8;
    --ice:#EAF2FC;
    --tiger:#F5A623;
    --tiger-deep:#E08A00;
    --snow:#FFFFFF;
    --mist:#F4F7FB;
    --ink:#152238;
    --sub:#5B6B84;
    --line:#DCE6F2;
    --good:#1E9E6B;
    --warn:#C0392B;
    --gold:#C9A227;
    --radius:20px;
    --radius-sm:12px;
    --shadow:0 8px 24px rgba(15,42,82,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,sans-serif;
    background:
      radial-gradient(140% 90% at 50% -10%, #163a6e 0%, #0F2A52 55%, #0A1E3D 100%);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:480px;margin:0 auto;min-height:100vh;background:var(--mist);position:relative;box-shadow:0 0 60px rgba(0,0,0,0.35);}
  button{font-family:inherit;}
  .app{padding-bottom:48px;}

  /* ===== Header ===== */
  .hero{
    position:relative;
    background:
      linear-gradient(180deg, rgba(255,255,255,0) 60%, var(--mist) 100%),
      radial-gradient(120% 100% at 15% 0%, #2E6FCC 0%, #163A6E 55%, #0B2148 100%);
    padding:22px 20px 30px;
    overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
    border-radius:50%;background:radial-gradient(circle, rgba(245,166,35,0.35), transparent 70%);
  }
  .hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;}
  .badge-region{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);
    color:#fff;font-size:13.5px;font-weight:700;letter-spacing:0.3px;
    padding:6px 12px;border-radius:999px;
  }
  .badge-week{
    background:var(--tiger);color:#1A1200;font-weight:800;font-size:13.5px;
    padding:6px 12px;border-radius:999px;letter-spacing:0.2px;
  }
  .hero-body{display:flex;align-items:center;gap:14px;margin-top:18px;position:relative;z-index:2;}
  .mascot-wrap{
    width:104px;height:104px;border-radius:28px;overflow:hidden;flex-shrink:0;
    background:linear-gradient(160deg,#2E6FCC,#0F2A52);
    box-shadow:0 10px 26px rgba(0,0,0,0.35), inset 0 0 0 3px rgba(255,255,255,0.18);
    animation:mascotFloat 3.6s ease-in-out infinite;
  }
  .mascot-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  @keyframes mascotFloat{
    0%,100%{transform:translateY(0) rotate(-1deg);}
    50%{transform:translateY(-6px) rotate(1deg);}
  }
  .mascot-wrap.cheer{animation:mascotCheer 0.7s ease-in-out;}
  @keyframes mascotCheer{
    0%{transform:scale(1) rotate(0);}
    30%{transform:scale(1.12) rotate(-6deg);}
    60%{transform:scale(1.08) rotate(6deg);}
    100%{transform:scale(1) rotate(0);}
  }
  .hero-text h1{margin:0 0 4px;color:#fff;font-size:20px;font-weight:800;line-height:1.35;letter-spacing:-0.2px;}
  .hero-text p{margin:0;color:#B9CBE8;font-size:14px;line-height:1.5;}
  .hero-quote{
    margin-top:16px;position:relative;z-index:2;
    background:rgba(255,255,255,0.08);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.18);border-radius:14px;
    padding:12px 14px;color:#EAF1FF;font-size:14px;font-weight:600;line-height:1.5;
  }

  /* ===== Section shells ===== */
  .section{padding:22px 20px 6px;}
  .section-title{
    display:flex;align-items:baseline;gap:6px;margin:0 0 12px;
    font-size:17px;font-weight:800;color:var(--navy);letter-spacing:-0.2px;
  }
  .section-title .num{color:var(--sky);font-size:14px;font-weight:800;}
  .section-title-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;
  }
  .poster-btn{
    flex-shrink:0;display:flex;align-items:center;gap:5px;
    background:#fff;border:1.5px solid var(--line);color:var(--navy);
    font-size:13px;font-weight:800;padding:7px 11px;border-radius:999px;cursor:pointer;
    box-shadow:0 2px 6px rgba(15,42,82,0.06);
  }
  .poster-btn:active{transform:scale(0.96);}
  .poster-overlay{
    position:fixed;inset:0;background:rgba(10,20,40,0.65);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .poster-sheet{
    width:100%;max-width:480px;max-height:88vh;background:var(--mist);
    border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;
    animation:sheetUp .22s ease-out;
  }
  @keyframes sheetUp{ from{transform:translateY(24px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  .poster-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;background:#fff;border-bottom:1px solid var(--line);
    font-size:16px;font-weight:800;color:var(--navy);flex-shrink:0;
  }
  .poster-close{
    border:none;background:var(--mist);width:30px;height:30px;border-radius:50%;
    font-size:15px;color:var(--sub);cursor:pointer;
  }
  .poster-scroll{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;}
  .poster-img{width:100%;border-radius:12px;display:block;box-shadow:0 4px 14px rgba(0,0,0,0.12);}
  .card{
    background:var(--snow);border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid rgba(15,42,82,0.05);padding:18px;
  }

  /* ===== Form ===== */
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:8px;
  }
  .field .hint{font-weight:500;color:var(--sub);font-size:13px;margin-top:6px;line-height:1.5;}
  .input-money{position:relative;}
  .input-money input{
    width:100%;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 44px 14px 16px;font-size:19px;font-weight:700;color:var(--ink);
    background:var(--mist);transition:border-color .15s, background .15s;
    -moz-appearance:textfield;
  }
  .input-money input::-webkit-outer-spin-button,
  .input-money input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .input-money input:focus{outline:none;border-color:var(--sky);background:#fff;}
  .input-money span{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    font-size:15px;font-weight:700;color:var(--sub);
  }
  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 4px;border-bottom:1px solid var(--line);
  }
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .t-label{font-size:15px;font-weight:700;color:var(--ink);}
  .toggle-row .t-sub{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px;}
  .switch{
    position:relative;width:50px;height:29px;border-radius:999px;border:none;
    background:#D9E1EC;cursor:pointer;flex-shrink:0;transition:background .18s;padding:0;
  }
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
    background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.22);transition:left .18s;
  }
  .switch.on{background:var(--tiger);}
  .switch.on::after{left:24px;}
  .group-title{font-size:13px;font-weight:800;color:var(--sky);text-transform:uppercase;letter-spacing:0.5px;margin:22px 0 10px;}
  .group-title:first-child{margin-top:0;}
  .lookup-error{
    background:#FDEDEC;color:var(--warn);font-size:14px;font-weight:700;
    border-radius:12px;padding:11px 14px;margin-top:6px;line-height:1.5;
  }

  .submit-btn{
    width:100%;margin-top:24px;padding:17px;border:none;border-radius:16px;
    background:linear-gradient(135deg,var(--tiger),var(--tiger-deep));
    color:#1A1200;font-size:17.5px;font-weight:800;letter-spacing:-0.2px;
    box-shadow:0 10px 22px rgba(224,138,0,0.35);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .submit-btn:active{transform:scale(0.98);}

  /* ===== Result ===== */
  .total-card{
    background:linear-gradient(150deg,#173B72 0%, #0F2A52 60%, #0A1E3D 100%);
    border-radius:24px;padding:26px 22px;color:#fff;position:relative;overflow:hidden;
    box-shadow:0 14px 30px rgba(10,20,40,0.35);
  }
  .total-card::after{
    content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle, rgba(245,166,35,0.28), transparent 70%);
  }
  .total-card .tc-label{font-size:14px;font-weight:700;color:#AEC3E4;position:relative;z-index:1;}
  .total-card .tc-amount{
    font-size:36px;font-weight:900;letter-spacing:-0.5px;margin:8px 0 2px;position:relative;z-index:1;
  }
  .total-card .tc-amount span{font-size:18px;font-weight:700;margin-left:2px;color:#DCE8FA;}
  .total-card .tc-note{font-size:13px;color:#8FA6C9;position:relative;z-index:1;line-height:1.6;margin-top:8px;}

  .detail-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .detail-item{
    display:flex;align-items:flex-start;gap:12px;background:var(--snow);
    border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);border:1px solid rgba(15,42,82,0.05);
  }
  .detail-item.dim{opacity:0.55;}
  .check-ic{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;
    background:rgba(30,158,107,0.12);display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .check-ic svg{width:15px;height:15px;}
  .check-ic.muted{background:#EDEFF3;}
  .check-ic.muted svg path{stroke:#9AA5B4;}
  .detail-body{flex:1;min-width:0;}
  .detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .detail-name{font-size:15.5px;font-weight:800;color:var(--navy);}
  .detail-amount{font-size:16.5px;font-weight:800;color:var(--good);white-space:nowrap;}
  .detail-amount.zero{color:#9AA5B4;}
  .detail-tag{
    display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;color:var(--tiger-deep);
    background:#FFF3E0;padding:2px 8px;border-radius:999px;
  }
  .detail-desc{font-size:13px;color:var(--sub);margin-top:5px;line-height:1.5;}

  .goods-grid{display:flex;flex-direction:column;gap:4px;margin-top:14px;}
  .goods-item{
    background:var(--snow);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);
    border:1px solid rgba(15,42,82,0.05);display:flex;gap:12px;align-items:center;
  }
  .goods-plus{
    display:flex;align-items:center;justify-content:center;height:22px;position:relative;z-index:1;
  }
  .goods-plus span{
    width:26px;height:26px;border-radius:50%;background:var(--tiger);color:#1A1200;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;
    box-shadow:0 3px 8px rgba(224,138,0,0.35);
  }
  .goods-icon{
    width:44px;height:44px;border-radius:12px;background:linear-gradient(150deg,#FFE7BE,#FFD088);
    display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;
  }
  .goods-type{
    display:inline-block;font-size:11px;font-weight:800;color:var(--tiger-deep);
    background:#FFF3E0;padding:2px 7px;border-radius:999px;margin-bottom:4px;
  }
  .goods-name{font-size:15px;font-weight:800;color:var(--navy);line-height:1.4;}
  .goods-sub{font-size:12.5px;color:var(--sub);margin-top:3px;}

  .next-card{
    margin-top:14px;background:var(--ice);border:1.5px dashed #9FC1EC;border-radius:16px;
    padding:15px 16px;
  }
  .next-card .nc-title{font-size:14px;font-weight:800;color:var(--sky);display:flex;align-items:center;gap:6px;}
  .next-card .nc-body{font-size:14px;color:var(--navy);font-weight:600;margin-top:6px;line-height:1.55;}
  .next-card .nc-body b{color:var(--tiger-deep);font-weight:800;}
  .next-card .nc-note{font-size:12px;color:var(--sub);margin-top:6px;font-weight:500;}
  .promo-banner{
    margin-top:12px;background:linear-gradient(120deg,#173B72,#0F2A52);color:#fff;
    border-radius:16px;padding:14px 16px;font-size:13.5px;font-weight:700;line-height:1.6;
    display:flex;gap:10px;align-items:flex-start;
  }
  .promo-banner .dot{width:6px;height:6px;border-radius:50%;background:var(--tiger);margin-top:6px;flex-shrink:0;}

  .share-row{display:flex;gap:10px;margin-top:22px;}
  .share-btn{
    flex:1;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:800;
    display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  }
  .share-btn.primary{background:var(--navy);color:#fff;}
  .share-btn.secondary{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .share-btn:active{transform:scale(0.97);}

  .redo-btn{
    width:100%;margin-top:12px;padding:14px;border-radius:14px;border:1.5px solid var(--line);
    background:transparent;color:var(--sub);font-size:14.5px;font-weight:700;cursor:pointer;
  }

  .legal{margin:26px 20px 0;font-size:12px;color:#9AA5B4;line-height:1.7;text-align:center;padding:0 6px;}
  .legal .lock{display:inline-block;margin-right:4px;}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:rgba(15,34,56,0.92);color:#fff;padding:11px 18px;border-radius:999px;
    font-size:14px;font-weight:600;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,0.3);
    white-space:nowrap;
  }

  .capture-card{padding:26px 22px;background:linear-gradient(160deg,#173B72,#0A1E3D);}
</style>
</head>

/* =========================================================
   2) 계산 로직 — UI와 완전히 분리
   ========================================================= */
const won = (n) => (n < 0 ? 0 : n).toLocaleString("ko-KR");

function findBand(bands, amount) {
  return bands.find(b => amount >= b.min && amount < b.max) || null;
}

function calcAwardA(input) {
  const { performance, highcap20, monthlyPass } = input;
  const cfg = CONFIG.awardA;
  const exceptionApplied = monthlyPass;

  if (exceptionApplied || performance >= cfg.fullRateFrom) {
    return {
      amount: performance,
      confirmed: true,
      note: performance >= cfg.fullRateFrom ? "실적의 100% 인정" : "예외조건 충족 · 실적 100% 인정",
      nextGoal: null,
    };
  }
  const band = findBand(cfg.bands, performance);
  if (!band) {
    return { amount: 0, confirmed: false, note: "5만원 미만 · 미지급", nextGoal: cfg.bands[2] };
  }
  const amount = highcap20 ? band.highcap : band.normal;
  const idx = cfg.bands.indexOf(band);
  const next = cfg.bands[idx + 1];
  let nextGoal = null;
  if (next) {
    const nextAmt = highcap20 ? next.highcap : next.normal;
    nextGoal = { remain: next.min - performance, gain: nextAmt - amount, atAmount: next.min };
    // 아직 하이캡 20배수 이상이 아니라면, 다음 구간 진입 + 하이캡 20배수 이상을
    // 함께 달성했을 때 늘어나는 금액도 별도로 계산합니다.
    if (!highcap20) {
      nextGoal.highcapGain = next.highcap - amount;
    }
  } else {
    nextGoal = { remain: cfg.fullRateFrom - performance, gain: null, atAmount: cfg.fullRateFrom, isFullRate: true };
  }
  return { amount, confirmed: true, note: highcap20 ? "하이캡 20배↑ 구간 적용" : null, nextGoal };
}

function calcAwardB(performance) {
  const band = findBand(CONFIG.awardB.bands, performance);
  if (!band) {
    const first = CONFIG.awardB.bands[0];
    return { achieved: false, band: null, nextGoal: { remain: first.min - performance, band: first } };
  }
  return { achieved: true, band, nextGoal: null };
}

function calcAwardHighstar(highcapAmount) {
  const cfg = CONFIG.awardHighstar;
  const achieved = highcapAmount >= cfg.minHighcapAmount;
  return { achieved, reward: cfg.reward, nextGoal: achieved ? null : { remain: cfg.minHighcapAmount - highcapAmount } };
}

function calcAwardC1(biamchiAmount) {
  const cfg = CONFIG.awardC_anyone;
  const units = Math.floor(biamchiAmount / cfg.unit);
  if (units < 1) {
    return { achieved: false, units: 0, nextGoal: { remain: cfg.unit - biamchiAmount } };
  }
  const nextUnitAt = (units + 1) * cfg.unit;
  return {
    achieved: true,
    units,
    reward: `${cfg.itemName} ${units}개`,
    nextGoal: { remain: nextUnitAt - biamchiAmount, atUnits: units + 1 },
  };
}

function calcAwardD(biamchiAmount) {
  // 사전활동 참여 여부와 무관하게 구간표 그대로 지급합니다.
  const band = findBand(CONFIG.awardD_biamchi.bands, biamchiAmount);
  if (!band) {
    const first = CONFIG.awardD_biamchi.bands[0];
    return { amount: 0, confirmed: false, nextGoal: { remain: first.min - biamchiAmount } };
  }
  return { amount: band.amount, confirmed: true };
}

function calcAwardE(performance) {
  const cfg = CONFIG.awardE_bridge;
  if (performance < cfg.minPerformanceForConfirm) {
    return {
      amount: 0, confirmed: false,
      nextGoal: { remain: cfg.minPerformanceForConfirm - performance },
    };
  }
  const band = findBand(cfg.bands, performance);
  if (!band) return { amount: 0, confirmed: false, nextGoal: { remain: cfg.bands[0].min - performance } };
  return { amount: band.amount, confirmed: true, rate: band.rate, payoutNote: cfg.payoutYear };
}

function calcAwardVIP(performance, highcapMultiple) {
  const cfg = CONFIG.awardVIP;
  const achieved = performance >= cfg.minAmount && highcapMultiple >= cfg.minHighcapMultiple;
  return { achieved, reward: cfg.reward, deadline: CONFIG.vipDeadline };
}

function calcAll(input) {
  // 비.암.치 플랜 금액은 이번 주 인보험 실적(①)에 이미 포함된 값이에요.
  // 즉, ①실적 10만원 중 5만원이 비.암.치 플랜이었다면 총 실적은 여전히 10만원이며,
  // 별도로 더 합산하지 않습니다. ①실적 값을 그대로 시상A·B에 사용합니다.
  const performance = input.performance;
  // VIP시상 판정용 하이캡 배수 = 하이캡 실적 ÷ 인보험 실적 (실적이 0이면 배수도 0)
  const highcapMultiple = performance > 0 ? input.highcapPerformance / performance : 0;

  const a = calcAwardA({ performance, highcap20: input.highcap20, monthlyPass: input.monthlyPass });
  const b = calcAwardB(performance);
  const highstar = calcAwardHighstar(input.highcapPerformance);
  const c1 = calcAwardC1(input.biamchiAmount);
  const d = calcAwardD(input.biamchiAmount);
  const e = calcAwardE(performance);
  const vip = calcAwardVIP(performance, highcapMultiple);

  const totalConfirmedCash =
    (a.confirmed ? a.amount : 0) +
    (d.confirmed ? d.amount : 0) +
    (e.confirmed ? e.amount : 0);

  return { a, b, highstar, c1, d, e, vip, totalConfirmedCash, performance, highcapMultiple };
}

function MoneyInput({ label, value, onChange, hint, placeholder }) {
  // 숫자 입력은 type="text" + inputMode="numeric"으로 처리합니다.
  // (type="number" 입력창은 마우스 휠 스크롤이나 브라우저 특성상
  //  입력 중 값이 임의로 바뀌는 문제가 있어, 문자열을 직접 다루는 방식으로 변경)
  const displayValue = value ? value.toLocaleString("ko-KR") : "";
  const handleChange = (e) => {
    const digitsOnly = e.target.value.replace(/[^0-9]/g, "");
    onChange(digitsOnly === "" ? 0 : Number(digitsOnly));
  };
  return (
    <div className="field">
      <label>{label}</label>
      <div className="input-money">
        <input
          type="text"
          inputMode="numeric"
          pattern="[0-9]*"
          placeholder={placeholder || "0"}
          value={displayValue}
          onChange={handleChange}
        />
        <span>원</span>
      </div>
      {hint && <div className="hint">{hint}</div>}
    </div>
  );
}

function LookupScreen({ onVerified }) {
  const [name, setName] = useState("");
  const [code, setCode] = useState("");
  const [needsCode, setNeedsCode] = useState(false);
  const [error, setError] = useState("");

  const handleSubmit = () => {
    const trimmedName = name.trim();
    if (!trimmedName) {
      setError("이름을 입력해주세요.");
      return;
    }

    // 명단 데이터(roster)가 아직 등록되지 않은 경우, 입력한 이름만으로 통과시킵니다.
    if (CONFIG.roster.length === 0) {
      onVerified({ name: trimmedName, code: "" });
      return;
    }

    const nameMatches = CONFIG.roster.filter((r) => r.name === trimmedName);

    if (nameMatches.length === 0) {
      setError("명단에서 확인되지 않는 이름이에요. 이름을 다시 확인해주세요.");
      return;
    }

    if (nameMatches.length === 1) {
      setError("");
      onVerified({ name: nameMatches[0].name, code: nameMatches[0].code });
      return;
    }

    // 동명이인이 있는 경우 코드를 추가로 요청합니다.
    if (!needsCode) {
      setNeedsCode(true);
      setError("동명이인이 있어요. 관리번호(코드)를 추가로 입력해주세요.");
      return;
    }

    const trimmedCode = code.trim();
    const exactMatch = nameMatches.find((r) => r.code === trimmedCode);
    if (!exactMatch) {
      setError("이름과 코드가 일치하는 분을 찾을 수 없어요. 코드를 다시 확인해주세요.");
      return;
    }
    setError("");
    onVerified({ name: exactMatch.name, code: exactMatch.code });
  };

  return (
    <div className="app">
      <div className="hero">
        <div className="hero-top">
          <span className="badge-region">🐯 {CONFIG.region}</span>
          <span className="badge-week">{CONFIG.weekLabel}</span>
        </div>
        <div className="hero-body">
          <div className="mascot-wrap">
            <img src={CONFIG.mascotImage} alt={CONFIG.mascotName} />
          </div>
          <div className="hero-text">
            <h1>본인 확인 후<br/>시상을 확인할 수 있어요</h1>
          </div>
        </div>
      </div>

      <div className="section">
        <div className="card">
          <div className="field">
            <label>이름</label>
            <div className="input-money">
              <input
                type="text"
                placeholder="이름을 입력해주세요"
                value={name}
                onChange={(e) => { setName(e.target.value); setNeedsCode(false); setError(""); }}
              />
            </div>
          </div>

          {needsCode && (
            <div className="field">
              <label>코드 (관리번호)</label>
              <div className="input-money">
                <input
                  type="text"
                  inputMode="numeric"
                  placeholder="코드를 입력해주세요"
                  value={code}
                  onChange={(e) => { setCode(e.target.value); setError(""); }}
                />
              </div>
              <div className="hint">동명이인 확인을 위해 코드가 필요해요.</div>
            </div>
          )}

          {error && <div className="lookup-error">{error}</div>}

          <button className="submit-btn" onClick={handleSubmit}>
            확인하고 시작하기 →
          </button>
        </div>
      </div>
      <div className="legal">
        <span className="lock">🔒</span>본인 확인 정보와 입력하신 실적은 이 기기에서만 계산됩니다.
      </div>
    </div>
  );
}

          <>
            <br />
            <a href={CONFIG.feedbackUrl} target="_blank" style={{ color: "#5B6B84" }}>의견 남기기</a>
          </>
        )}
      </div>

      {toast && <div className="toast">{toast}</div>}
      <PosterModal open={posterOpen} onClose={() => setPosterOpen(false)} />
    </div>
  );
}

function App() {
  const [step, setStep] = useState("lookup");
  const [verifiedUser, setVerifiedUser] = useState(null);
  const [input, setInput] = useState({
    performance: 0,
    highcapPerformance: 0,
    biamchiAmount: 0,
    highcap20: false,
    monthlyPass: false,
  });

  if (step === "lookup") {
    return (
      <LookupScreen
        onVerified={(user) => {
          setVerifiedUser(user);
          setStep("form");
        }}
      />
    );
  }
  if (step === "result") {
    return <ResultView input={input} onReset={() => setStep("form")} />;
  }
  return <IntroForm input={input} setInput={setInput} onSubmit={() => setStep("result")} verifiedUser={verifiedUser} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
