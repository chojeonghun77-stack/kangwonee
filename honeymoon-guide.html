<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>젼 훈의 신혼여행 가이드 · 부다페스트→비엔나→잘츠부르크→할슈타트→프라하</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --ink:#1c2531;
    --ink-soft:#2c3646;
    --paper:#faf6ee;
    --paper-dim:#f1ead8;
    --paper-line:#e4d9bf;
    --gold:#c2924e;
    --gold-soft:#e8d3a8;
    --hun:#8c3b3b;
    --hun-soft:#f3e2df;
    --aut:#3f6b4a;
    --aut-soft:#e1ebe1;
    --cze:#2e4c74;
    --cze-soft:#dfe6ef;
    --muted:#6b6558;
    --line:#d9d0bb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .serif{font-family:'Noto Serif KR', serif;}
  #root{min-height:100vh;}
  ::selection{background:var(--gold-soft);}

  /* ---------- layout shell ---------- */
  .app{
    max-width:1180px;
    margin:0 auto;
    background:var(--paper);
    min-height:100vh;
    box-shadow:0 0 60px rgba(0,0,0,.35);
  }
  .topbar{
    background:var(--ink);
    color:var(--paper);
    padding:22px 28px 18px;
    position:sticky; top:0; z-index:50;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .topbar-row{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:var(--gold-soft); opacity:.85;}
  .brand h1{font-family:'Noto Serif KR',serif; font-size:22px; margin:2px 0 0; font-weight:700; letter-spacing:-.01em;}
  .brand .route{font-size:12.5px; color:#c9cfd8; margin-top:4px;}
  .tabs{display:flex; gap:4px; margin-top:16px; flex-wrap:wrap;}
  .tab{
    background:transparent; border:1px solid rgba(255,255,255,.16);
    color:#d7dbe2; padding:8px 14px; border-radius:999px; font-size:13.5px;
    cursor:pointer; font-family:'Noto Sans KR',sans-serif; font-weight:500;
    transition:background .15s, color .15s, border-color .15s;
  }
  .tab:hover{border-color:rgba(255,255,255,.4);}
  .tab.active{background:var(--gold); border-color:var(--gold); color:#241a0c; font-weight:700;}

  .content{padding:28px;}
  @media (max-width:640px){ .content{padding:18px;} .topbar{padding:18px 16px 14px;} }

  /* ---------- route timeline (day picker) ---------- */
  .route-rail{
    display:flex; overflow-x:auto; gap:0; padding:6px 2px 18px;
    border-bottom:1px solid var(--line); margin-bottom:22px;
  }
  .stop{
    flex:0 0 auto; text-align:center; padding:0 16px; position:relative; cursor:pointer;
    min-width:66px;
  }
  .stop:not(:last-child)::after{
    content:''; position:absolute; top:22px; right:-2px; width:32px; height:2px;
    background:var(--line);
  }
  .stop .dot{
    width:13px; height:13px; border-radius:50%; margin:8px auto 6px; border:2px solid var(--muted); background:var(--paper);
  }
  .stop.active .dot{ background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 4px var(--gold-soft); }
  .stop .d{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);}
  .stop.active .d{color:var(--ink); font-weight:600;}
  .stop .city{font-size:11.5px; color:#a89f8a; margin-top:2px; letter-spacing:.02em;}
  .stop.active .city{color:var(--ink); font-weight:700;}

  /* ---------- day card ---------- */
  .day-head{display:flex; align-items:center; gap:14px; margin-bottom:6px; flex-wrap:wrap;}
  .day-badge{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;
    padding:5px 11px; border-radius:6px; color:#fff;
  }
  .day-head h2{font-family:'Noto Serif KR',serif; font-size:26px; margin:0; font-weight:700;}
  .day-sub{color:var(--muted); font-size:13.5px; margin:2px 0 22px;}

  .grid2{display:grid; grid-template-columns:1.3fr 1fr; gap:22px;}
  @media (max-width:860px){ .grid2{grid-template-columns:1fr;} }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px;
  }
  .card h3{
    font-family:'Noto Serif KR',serif; font-size:15.5px; margin:0 0 12px; font-weight:700;
    display:flex; align-items:center; gap:8px;
  }
  .card h3 .bar{width:4px; height:15px; border-radius:2px; display:inline-block;}

  table.sched{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.sched td{padding:9px 6px; border-top:1px solid var(--paper-line); vertical-align:top;}
  table.sched tr:first-child td{border-top:none;}
  table.sched .t{font-family:'IBM Plex Mono',monospace; color:var(--muted); white-space:nowrap; width:56px; font-size:12.5px; padding-top:11px;}
  table.sched .ti{font-weight:600;}
  table.sched .tr-note{color:var(--muted); font-size:12px; margin-top:2px;}

  .note-block{background:var(--paper-dim); border-radius:8px; padding:13px 15px; font-size:13px; line-height:1.65; margin-bottom:10px;}
  .note-block:last-child{margin-bottom:0;}
  .note-block b{color:var(--ink);}
  .tip-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; color:var(--gold); font-weight:600; display:block; margin-bottom:4px;}

  .landmark{border-left:3px solid var(--gold-soft); padding:4px 0 4px 12px; margin-bottom:12px;}
  .landmark:last-child{margin-bottom:0;}
  .landmark .name{font-weight:700; font-size:13.5px;}
  .landmark p{font-size:12.8px; color:#4a4438; margin:3px 0 0; line-height:1.6;}

  .culture-strip{
    background:var(--ink); color:var(--paper); border-radius:10px; padding:16px 20px; margin-top:4px; font-size:13px; line-height:1.7;
  }
  .culture-strip .tip-label{color:var(--gold-soft);}

  /* ---------- country guide ---------- */
  .country-tabs{display:flex; gap:8px; margin-bottom:20px;}
  .ctab{
    flex:1; padding:12px; border-radius:9px; border:1.5px solid var(--line); background:#fff; cursor:pointer;
    text-align:center; font-weight:700; font-family:'Noto Serif KR',serif; font-size:14.5px; color:var(--muted);
  }
  .ctab.active{border-color:currentColor; color:#fff;}
  .section-title{font-family:'Noto Serif KR',serif; font-size:15px; font-weight:700; margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
  .section-title .bar{width:4px; height:14px; border-radius:2px;}
  .pillbox{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px;}
  .pill{background:var(--paper-dim); border-radius:7px; padding:9px 12px; font-size:12.8px; line-height:1.55;}
  .pill b{display:block; font-size:11.5px; color:var(--muted); margin-bottom:2px; font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .warnlist{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px;}
  .warnlist li{font-size:13px; line-height:1.6; padding-left:18px; position:relative;}
  .warnlist li::before{content:'—'; position:absolute; left:0; color:var(--gold);}
  .histgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:700px){ .histgrid{grid-template-columns:1fr;} }

  /* ---------- booking guide ---------- */
  .bk-item{border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; background:#fff;}
  .bk-item .bk-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .bk-item h4{font-family:'Noto Serif KR',serif; font-size:15px; margin:0; font-weight:700;}
  .bk-when{font-family:'IBM Plex Mono',monospace; font-size:10.5px; background:var(--ink); color:var(--gold-soft); padding:3px 9px; border-radius:5px;}
  .bk-item p{font-size:13px; line-height:1.7; color:#3a352b; margin:10px 0 0;}
  .bk-item .how{margin-top:8px; font-size:12.8px; background:var(--paper-dim); padding:10px 12px; border-radius:7px; line-height:1.65;}
  .bk-item .how b{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--gold); display:block; margin-bottom:3px;}

  /* ---------- checklist ---------- */
  .check-cat{margin-bottom:22px;}
  .check-cat h3{font-family:'Noto Serif KR',serif; font-size:15px; margin:0 0 10px;}
  .check-row{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-top:1px solid var(--paper-line);}
  .check-row:first-of-type{border-top:none;}
  .check-row input{margin-top:3px; width:16px; height:16px; accent-color:var(--gold);}
  .check-row .cname{font-weight:600; font-size:13.5px;}
  .check-row .cdesc{font-size:12.3px; color:var(--muted); margin-top:2px; line-height:1.55;}

  .footer-note{color:var(--muted); font-size:11.8px; text-align:center; padding:30px 20px 40px; line-height:1.8;}
</style>
</head>

/* ============================= COMPONENTS ============================= */

function Sched({items}){
  return (
    <table className="sched"><tbody>
      {items.map((r,i)=>(
        <tr key={i}>
          <td className="t">{r.t}</td>
          <td>
            <div className="ti">{r.ti}</div>
            {r.note && <div className="tr-note">{r.note}</div>}
          </td>
        </tr>
      ))}
    </tbody></table>
  );
}

function DayView({day}){
  return (
    <div>
      <div className="day-head">
        <span className="day-badge" style={{background:day.color}}>{day.dplus}</span>
        <h2>{day.city}</h2>
      </div>
      <div className="day-sub">{day.date} · 여행 {day.id}일차</div>

      <div className="grid2">
        <div>
          <div className="card">
            <h3><span className="bar" style={{background:day.color}}></span>일정표</h3>
            <Sched items={day.schedule} />
          </div>

          <div className="card">
            <h3><span className="bar" style={{background:day.color}}></span>이동 · 예약 상세 안내</h3>
            {day.transport.map((tp,i)=>(
              <div className="note-block" key={i}>
                <span className="tip-label">{tp.label}</span>
                {tp.body}
              </div>
            ))}
          </div>
        </div>

        <div>
          {day.landmarks.length>0 &&
          <div className="card">
            <h3><span className="bar" style={{background:day.color}}></span>명소 이야기</h3>
            {day.landmarks.map((l,i)=>(
              <div className="landmark" key={i}>
                <div className="name">{l.name}</div>
                <p>{l.desc}</p>
              </div>
            ))}
          </div>}

          <div className="culture-strip">
            <span className="tip-label">현지 문화 팁</span>
            {day.culture}
          </div>
        </div>
      </div>
    </div>
  );
}

function ItineraryTab(){
  const [sel, setSel] = useState(1);
  const day = DAYS.find(d=>d.id===sel);
  return (
    <div>
      <div className="route-rail">
        {DAYS.map(d=>(
          <div key={d.id} className={"stop"+(d.id===sel?' active':'')} onClick={()=>setSel(d.id)}>
            <div className="dot" style={d.id===sel?{background:d.color, borderColor:d.color, boxShadow:'0 0 0 4px '+d.color+'33'}:{}}></div>
            <div className="d">{d.dplus}</div>
            <div className="city">{d.city.split('→')[0]}</div>
          </div>
        ))}
      </div>
      <DayView day={day} />
    </div>
  );
}

function CountryTab(){
  const [sel, setSel] = useState('hungary');
  const c = COUNTRIES[sel];
  return (
    <div>
      <div className="country-tabs">
        {Object.values(COUNTRIES).map(cc=>(
          <div key={cc.key}
               className={"ctab"+(sel===cc.key?' active':'')}
               style={sel===cc.key?{background:cc.color, borderColor:cc.color, color:'#fff'}:{color:cc.color}}
               onClick={()=>setSel(cc.key)}>
            {cc.name}
          </div>
        ))}
      </div>

      <div className="pillbox">
        {c.basic.map((b,i)=>(
          <div className="pill" key={i} style={{flex:'1 1 45%'}}><b>{b.k}</b>{b.v}</div>
        ))}
      </div>

      <div className="section-title"><span className="bar" style={{background:c.color}}></span>문화와 생활</div>
      <ul className="warnlist">{c.culture.map((t,i)=><li key={i}>{t}</li>)}</ul>

      <div className="section-title"><span className="bar" style={{background:c.color}}></span>주의해야 할 점</div>
      <ul className="warnlist">{c.caution.map((t,i)=><li key={i}>{t}</li>)}</ul>

      <div className="section-title"><span className="bar" style={{background:c.color}}></span>주요 명소의 역사</div>
      <div className="histgrid">
        {c.landmarks.map((l,i)=>(
          <div className="landmark" key={i}>
            <div className="name">{l.name} <span style={{color:'var(--muted)', fontWeight:400, fontSize:'11.5px'}}>· {l.period}</span></div>
            <p>{l.desc}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

function BookingTab(){
  return (
    <div>
      <div className="section-title"><span className="bar" style={{background:'var(--gold)'}}></span>예약 가이드 — 언제, 무엇을, 어디서</div>
      {BOOKING_GUIDE.map((b,i)=>(
        <div className="bk-item" key={i}>
          <div className="bk-top">
            <h4>{b.title}</h4>
            <span className="bk-when">{b.when}</span>
          </div>
          <p>{b.body}</p>
          {b.how && <div className="how"><b>어디서 / 어떻게</b>{b.how}</div>}
        </div>
      ))}
    </div>
  );
}

function ChecklistTab(){
  return (
    <div>
      <div className="section-title"><span className="bar" style={{background:'var(--gold)'}}></span>출발 전 최종 체크리스트</div>
      {CHECKLIST.map((cat,i)=>(
        <div className="check-cat" key={i}>
          <h3>{cat.cat}</h3>
          {cat.items.map((it,j)=>(
            <label className="check-row" key={j}>
              <input type="checkbox" />
              <div>
                <div className="cname">{it.n}</div>
                {it.d && <div className="cdesc">{it.d}</div>}
              </div>
            </label>
          ))}
        </div>
      ))}
    </div>
  );
}

function App(){
  const [tab, setTab] = useState('itinerary');
  const TABS = [
    {k:'itinerary', label:'일정 (D+1~D+11)'},
    {k:'booking', label:'교통 · 예약 가이드'},
    {k:'country', label:'나라별 문화 가이드'},
    {k:'checklist', label:'체크리스트'},
  ];
  return (
    <div className="app">
      <div className="topbar">
        <div className="topbar-row">
          <div className="brand">
            <span className="eyebrow mono">JEON · HOON HONEYMOON JOURNAL</span>
            <h1 className="serif">젼 훈의 신혼여행 가이드</h1>
            <div className="route">9.14 – 9.24 · 부다페스트 → 비엔나 → 잘츠부르크 → 할슈타트 → 프라하</div>
          </div>
        </div>
        <div className="tabs">
          {TABS.map(t=>(
            <button key={t.k} className={"tab"+(tab===t.k?' active':'')} onClick={()=>setTab(t.k)}>{t.label}</button>
          ))}
        </div>
      </div>

      <div className="content">
        {tab==='itinerary' && <ItineraryTab/>}
        {tab==='booking' && <BookingTab/>}
        {tab==='country' && <CountryTab/>}
        {tab==='checklist' && <ChecklistTab/>}
      </div>

      <div className="footer-note">
        본 가이드는 첨부된 일정표를 바탕으로 작성되었습니다. 열차·버스 시간표와 요금은 현지 사정에 따라 바뀔 수 있으니<br/>
        출발 전 OBB(oebb.at), BudapestGO, Wiener Linien 등 공식 채널에서 최종 확인하세요. 행복한 신혼여행 되세요 💛
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
